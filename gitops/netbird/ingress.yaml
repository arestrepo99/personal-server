# Path routing is the one part of this manifest set that's a best-effort
# reconstruction of NetBird's well-known Traefik routing pattern (management
# API/gRPC/OIDC paths -> backend, everything else -> dashboard SPA), not
# something pulled from a doc I could fetch this session. Verify against
# actual 404s/behavior after first deploy and adjust path list if needed --
# see README.md in this directory.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: netbird
  namespace: netbird
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - netbird.arec.me
      secretName: netbird-tls
  rules:
    - host: netbird.arec.me
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: netbird-server
                port:
                  name: http
          # These two are raw gRPC (not gRPC-Web/REST) -- e.g. the mobile
          # app's GetServerKey call. Routed at the h2c-flagged Service
          # (service.yaml) so Traefik speaks HTTP/2 cleartext to the
          # backend; the plain "http" Service/paths above default to
          # HTTP/1.1 and gRPC fails against them with a bare 404 (confirmed:
          # mobile client got "unexpected HTTP status code ... 404" with
          # content-type text/plain -- Traefik's own not-found page, meaning
          # no proper HTTP/2 response ever came back from the backend).
          - path: /management.ManagementService
            pathType: Prefix
            backend:
              service:
                name: netbird-server-grpc
                port:
                  name: grpc
          - path: /signalexchange.SignalExchange
            pathType: Prefix
            backend:
              service:
                name: netbird-server-grpc
                port:
                  name: grpc
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: netbird-server
                port:
                  name: http
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: netbird-server
                port:
                  name: http
          # Relay WebSocket handler -- confirmed from netbird-server startup
          # logs ("Relay WebSocket handler added (path: /relay)"). Missing
          # this route was the actual cause of the pod's own healthcheck
          # self-test failing ("expected handshake response status code 101
          # but got 404") -- it was falling through to the dashboard's 404
          # page instead of hitting the relay handler.
          - path: /relay
            pathType: Prefix
            backend:
              service:
                name: netbird-server
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: netbird-dashboard
                port:
                  name: http
