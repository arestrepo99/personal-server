apiVersion: v1
kind: Service
metadata:
  name: netbird-server
  namespace: netbird
spec:
  selector:
    app: netbird-server
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
# Same pod, same port -- but a raw gRPC client (e.g. the mobile app's
# GetServerKey call) needs Traefik to speak HTTP/2 cleartext (h2c) to the
# backend, not HTTP/1.1. Flipping the *main* netbird-server Service to h2c
# would risk breaking the /relay WebSocket upgrade and the plain-HTTP
# /oauth2 and /api paths (WebSocket-over-HTTP/2 needs Extended CONNECT
# support most proxies don't have). So: a second Service, used only for the
# actual gRPC paths in ingress.yaml.
#
# NOTE: `appProtocol: h2c` (a generic Kubernetes field) does NOT actually
# make Traefik speak h2c -- Traefik's Kubernetes Ingress provider doesn't
# infer scheme from it. The real mechanism is the annotation below. Using
# the wrong one didn't just leave gRPC broken -- it very likely made
# Traefik fail to rebuild routers for this *entire* Ingress object
# atomically, which is why unrelated paths in the same Ingress resource
# (/api, /.well-known) started 404ing too, not just the gRPC ones.
apiVersion: v1
kind: Service
metadata:
  name: netbird-server-grpc
  namespace: netbird
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: h2c
spec:
  selector:
    app: netbird-server
  ports:
    - name: grpc
      port: 8080
      targetPort: http
      protocol: TCP
---
# STUN needs its own Service of type LoadBalancer so k3s's built-in
# servicelb (klipper-lb) binds UDP/3478 directly on the host's public IP --
# a ClusterIP Service can't be reached from the internet for a UDP protocol
# that isn't going through the Ingress/Traefik.
apiVersion: v1
kind: Service
metadata:
  name: netbird-stun
  namespace: netbird
spec:
  type: LoadBalancer
  selector:
    app: netbird-server
  ports:
    - name: stun
      port: 3478
      targetPort: stun
      protocol: UDP
