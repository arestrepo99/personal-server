apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    # Forward the host's 80/443 straight to the Traefik pod via CNI portmap.
    # Traefik still listens on 8000/8443 inside its own netns, so this needs
    # neither hostNetwork nor NET_BIND_SERVICE.
    ports:
      web:
        hostPort: 80
      websecure:
        hostPort: 443
    # ClusterIP so servicelb doesn't spawn an svclb DaemonSet: its extra NAT
    # hop MASQUERADEs the source address, which is what was corrupting
    # X-Forwarded-For. The hostPort above already does the forward and
    # preserves the real client IP.
    service:
      spec:
        type: ClusterIP