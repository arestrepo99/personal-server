# Stage 1 of the netbird-l2tp-bridge: L2TP/IPsec client only, no NetBird
# container yet. Goal right now is just to get the tunnel up and reachable
# from inside the pod. Base image + apt-get-at-startup + ConfigMap script,
# same pattern as gitops/dynamic-dns, since there's no image build/registry
# pipeline in this repo.
#
# strongswan needs NET_ADMIN (XFRM policy/state via netlink) and NET_RAW.
# xl2tpd/pppd need NET_ADMIN, NET_RAW, and /dev/ppp (the host's ppp_generic
# driver -- confirmed loaded; the host is missing l2tp_ppp, but that's only
# needed for xl2tpd's optional kernel-accelerated data path, not the default
# userspace one, so this still works).
#
# strategy: Recreate -- most L2TP servers reject/kill a second concurrent
# login with the same username, so two pods must never run at once. Also
# avoids two NetBird identities fighting over one peer once that's added.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-l2tp-bridge
  namespace: netbird-l2tp-bridge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: netbird-l2tp-bridge
  template:
    metadata:
      labels:
        app: netbird-l2tp-bridge
    spec:
      containers:
        - name: l2tp-client
          image: debian:bookworm-slim
          command:
            - sh
            - -c
            - |
              set -e
              # Retry: a transient mirror failure here exits 100 and takes the
              # whole container down (observed). Since packages are fetched on
              # every start, that turns any blip into a restart loop.
              for i in 1 2 3; do
                apt-get update \
                  && apt-get install -y --no-install-recommends \
                       strongswan strongswan-starter xl2tpd ppp iproute2 \
                       iputils-ping procps iptables \
                  && break
                echo "apt attempt $i failed, retrying..." >&2
                [ "$i" = 3 ] && exit 1
                sleep 5
              done
              exec bash /scripts/entrypoint.sh
          envFrom:
            - configMapRef:
                name: netbird-l2tp-bridge-env
            - secretRef:
                name: netbird-l2tp-bridge-secret
          securityContext:
            # privileged is required for /dev/ppp, not just for the caps. The
            # hostPath mount below makes the device *node* visible, but the
            # device cgroup still denies open() on it -- pppd got EPERM and
            # reported the misleading "this system lacks PPP kernel support"
            # (the host kernel has ppp_generic builtin and is fine). k8s has
            # no per-device allowlist in the pod spec, so privileged is the
            # only way to grant it. Caps kept explicit for documentation;
            # privileged already implies them.
            privileged: true
            capabilities:
              add: ["NET_ADMIN", "NET_RAW"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: dev-ppp
              mountPath: /dev/ppp

        # Stage 2: the NetBird peer. It shares this pod's network namespace,
        # so it sees ppp0 directly and the routing the l2tp container's
        # ip-up hook installs applies to its traffic with no extra plumbing.
        # That shared netns is the whole reason this is a sidecar and not its
        # own pod.
        #
        # privileged for the same reason as the l2tp container: it needs
        # /dev/net/tun to bring up wt0, and a hostPath mount alone only
        # exposes the device node -- the device cgroup still denies open().
        - name: netbird
          image: netbirdio/netbird:latest
          env:
            - name: NB_FOREGROUND_MODE
              value: "true"
            # State lives in the container; the peer re-registers with the
            # setup key on restart. Keep the key reusable (see README).
            - name: NB_CONFIG
              value: /var/lib/netbird/config.json
          envFrom:
            - configMapRef:
                name: netbird-l2tp-bridge-env
            # optional: a missing secretRef blocks the whole *pod* from
            # starting, which would take the working L2TP tunnel down with
            # it. This way the bridge keeps running and only this container
            # crashloops until the setup key is sealed (see README).
            - secretRef:
                name: netbird-l2tp-bridge-netbird
                optional: true
          securityContext:
            privileged: true
            capabilities:
              add: ["NET_ADMIN", "NET_RAW", "SYS_ADMIN"]
          volumeMounts:
            - name: dev-net-tun
              mountPath: /dev/net/tun
            - name: netbird-state
              mountPath: /var/lib/netbird
      volumes:
        - name: scripts
          configMap:
            name: netbird-l2tp-bridge
        - name: dev-ppp
          hostPath:
            path: /dev/ppp
            type: CharDevice
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        # emptyDir, not a PVC: NetBird state is re-derivable by re-running the
        # setup key, and a PVC would pin this pod to one node for no gain.
        - name: netbird-state
          emptyDir: {}
