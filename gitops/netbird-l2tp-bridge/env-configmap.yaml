# Non-secret connection info -- server hostname and username aren't
# sensitive, so these are committed in plaintext rather than sealed. Only
# the password and PSK (in the Secret) get encrypted.
apiVersion: v1
kind: ConfigMap
metadata:
  name: netbird-l2tp-bridge-env
  namespace: netbird-l2tp-bridge
data:
  L2TP_SERVER: "providencia.arec.me"
  L2TP_USER: "server"

  # Subnets on the far side of the tunnel, routed out ppp0. Space-separated.
  # 192.168.1.0/24 is the L2TP server's own LAN (the server answers on
  # 192.168.1.15); 192.168.20.0/24 is where the DNS server pppd hands us
  # (192.168.20.1) lives. Advertise the matching ranges in the NetBird
  # dashboard -- this only builds the routes, it doesn't advertise them.
  REMOTE_SUBNETS: "192.168.1.0/24 192.168.20.0/24"

  # NetBird sidecar. Management is the self-hosted server in the netbird
  # namespace (gitops/netbird), reached over its public ingress.
  NB_MANAGEMENT_URL: "https://netbird.arec.me"
  NB_HOSTNAME: "netbird-l2tp-bridge"

  # Source prefix used to policy-route NetBird traffic out ppp0. NetBird
  # allocates peer addresses from the CGNAT range by default. Matching on
  # source rather than "iif wt0" keeps the rule valid even when ppp0 comes
  # up before the sidecar has created wt0.
  NETBIRD_CIDR: "100.64.0.0/10"
