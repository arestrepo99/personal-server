apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamic-dns
  namespace: dynamic-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dynamic-dns
  template:
    metadata:
      labels:
        app: dynamic-dns
    spec:
      containers:
        - name: dynamic-dns
          image: python:3.12-slim
          command: ["sh", "-c", "pip install --no-cache-dir fastapi uvicorn httpx && python /app/app.py"]
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: app
              mountPath: /app
      volumes:
        - name: app
          configMap:
            name: dynamic-dns
