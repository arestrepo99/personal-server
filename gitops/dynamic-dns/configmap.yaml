apiVersion: v1
kind: ConfigMap
metadata:
  name: dynamic-dns
  namespace: dynamic-dns
data:
  app.py: |
    from fastapi import FastAPI, Request
    from fastapi.responses import PlainTextResponse, Response
    import uvicorn
    import httpx

    app = FastAPI()

    NAMECHEAP_UPDATE_URL = "https://dynamicdns.park-your-domain.com/update"

    @app.api_route("/{full_path:path}", methods=["GET", "POST"])
    async def relay_request(request: Request, full_path: str):
        forwarded_for = request.headers.get("x-forwarded-for")
        real_ip = forwarded_for.split(",")[0].strip() if forwarded_for else 'not forwarded'

        params = dict(request.query_params)
        params["ip"] = real_ip

        if 'password' not in params:
          return Response(status_code=400)
        if not params['password'].startswith('6437'):
          return Response(status_code=400, content=f"Invalid request from {real_ip}") 

        print("\n" + "="*60)
        print(f"RELAYING REQUEST TO NAMECHEAP")
        print(f"Original query params: {dict(request.query_params)}")
        print(f"Relayed query params: {params}")
        print(f"Real IP: {real_ip}")
        print("="*60 + "\n")

        async with httpx.AsyncClient() as client:
            resp = await client.get(NAMECHEAP_UPDATE_URL, params=params)

        print(f"Namecheap response ({resp.status_code}):")
        print(resp.text)
        print("="*60 + "\n")

        return PlainTextResponse(resp.text, status_code=resp.status_code)

    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8000, log_level="debug")
